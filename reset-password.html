<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bansal Material House CRM — Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'DM Sans', -apple-system, sans-serif; background: linear-gradient(135deg, #6D28D9 0%, #4C1D95 100%); }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 420px; animation: fadeUp 0.5s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; font-weight: 700; color: #0F172A; margin-bottom: 8px; letter-spacing: -0.02em; }
    p { font-size: 14.5px; color: #475569; margin-bottom: 28px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #0F172A; margin-bottom: 8px; }
    input { width: 100%; padding: 13px 14px; border: 1.5px solid #E2E8F0; border-radius: 10px; font-size: 14.5px; font-family: inherit; outline: none; transition: all 0.18s; }
    input:focus { border-color: #6D28D9; box-shadow: 0 0 0 4px rgba(109, 40, 217, 0.1); }
    button { width: 100%; padding: 14px; background: #6D28D9; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.18s; box-shadow: 0 4px 12px rgba(109, 40, 217, 0.25); }
    button:hover { background: #5B21B6; transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .alert { display: none; padding: 12px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 18px; }
    .alert.show { display: block; }
    .alert.error { background: #FEE2E2; color: #DC2626; border: 1px solid #FCA5A5; }
    .alert.success { background: #D1FAE5; color: #059669; border: 1px solid #6EE7B7; }
    .footer-link { display: block; margin-top: 24px; text-align: center; font-size: 13px; color: #6D28D9; text-decoration: none; font-weight: 500; }
    .footer-link:hover { color: #5B21B6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Reset password</h1>
      <p>Enter a new password for your Bansal Material House CRM account.</p>

      <div id="errorMsg" class="alert error"></div>
      <div id="successMsg" class="alert success"></div>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter the password" required autocomplete="new-password" minlength="6">
        </div>
        <button type="submit" id="submitBtn">Update password</button>
      </form>

      <a href="login.html" class="footer-link">← Back to login</a>
    </div>
  </div>

<script>
  var supabaseClient = supabase.createClient(
    window.BMH_CONFIG.SUPABASE_URL,
    window.BMH_CONFIG.SUPABASE_ANON_KEY
  );

  var errorMsg = document.getElementById('errorMsg');
  var successMsg = document.getElementById('successMsg');
  var submitBtn = document.getElementById('submitBtn');

  // When the user clicks the link in their email, Supabase puts a recovery token in the URL hash.
  // The Supabase client auto-detects it and creates a temporary session that lets us call updateUser.
  // We just need to wait for that session to load.

  (async function checkRecoverySession() {
    var { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      // Listen for the auto-handled PASSWORD_RECOVERY event
      supabaseClient.auth.onAuthStateChange(function(event, sess) {
        if (event === 'PASSWORD_RECOVERY') {
          // Now we have a temporary session
        }
      });
    }
  })();

  document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');

    var newPwd = document.getElementById('newPassword').value;
    var confirmPwd = document.getElementById('confirmPassword').value;

    if (newPwd.length < 6) {
      errorMsg.textContent = 'Password must be at least 6 characters.';
      errorMsg.classList.add('show');
      return;
    }
    if (newPwd !== confirmPwd) {
      errorMsg.textContent = 'Passwords do not match.';
      errorMsg.classList.add('show');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    try {
      var { data, error } = await supabaseClient.auth.updateUser({
        password: newPwd
      });
      if (error) throw error;

      successMsg.textContent = 'Password updated! Redirecting to login...';
      successMsg.classList.add('show');

      // Sign out the temporary recovery session
      await supabaseClient.auth.signOut();

      setTimeout(function() {
        window.location.href = 'login.html';
      }, 2000);

    } catch (err) {
      errorMsg.textContent = 'Error: ' + (err.message || 'Failed to update password. The link may have expired.');
      errorMsg.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update password';
    }
  });
</script>
</body>
</html>
